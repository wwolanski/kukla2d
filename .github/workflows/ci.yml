name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.x
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Run full quality gate
        run: npm run check

  coverage:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.x
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Enforce coverage thresholds
        run: npm run test:coverage

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.x
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production-build E2E tests
        run: npm run test:e2e
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
