# RepoAtlas configuration owned by Kukla2D. Paths are relative to the repository root.
paths:
  source: src
  features: src/features
  packages: packages
  tests: test
  # RepoAtlas's own TypeScript project. It is intentionally independent from
  # the root tsconfig.json used by Kukla2D's regular build workflow.
  tsconfig: .repoatlas/tsconfig.json

alias: "@"

ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/external_repos/**"
  - "**/_context/**"
  - "**/node_modules/**"
  - "**/playwright-report/**"
  - "**/test-results/**"

typescript:
  # This manifest must stay inside .repoatlas/tsconfig.json's include set.
  # The remaining test files are Vitest fixtures and are checked by Vitest,
  # not by RepoAtlas's production typed-ESLint project.
  manifest:
    - src/**/*.ts
    - src/**/*.tsx
    - packages/**/*.ts
    - packages/**/*.tsx
    - scripts/**/*.mts
    - test/types/**/*.ts
  defaultProjectFiles:
    - test/projectSchema.test.ts
    - test/migrateProject.test.ts
    - test/projectDocumentContract.test.ts
    - test/trackBinding.test.ts
    - test/typescriptMigrationScope.test.ts
    - test/fixtures/goldenProject.ts
    - test/domain/animationTransport.test.ts
    - test/export/exportAreaPresets.test.ts
    - test/domain/animationTargets.test.ts
    - test/domain/editorModeFeedback.test.ts
    - test/layers/buildLibraryTree.test.ts
    - test/modular-sprite/modularSpriteProcessor.test.ts
    - test/modular-sprite/modularSpriteGrouping.test.ts
    - test/modular-sprite/modularSpriteWizardState.test.ts
    - test/modular-sprite/modularSpriteFinalize.test.ts
    - test/modular-sprite/modularSpriteProjectSchema.test.ts
    - test/modular-sprite-schema/modularSpriteSchema.test.ts
    - test/runtime/pathConstraint.test.ts
    - test/runtime/physicsRig.test.ts
    - test/runtime/skin.test.ts
    - test/timeline/timelineTime.test.ts

# Tests under test/<feature> mirror src/features/<feature>. Root-level and
# integration/contract tests remain external consumers of public feature APIs.
testing:
  roots:
    - path: test
      ownership: mirrored

typeLocality:
  ignoredPrefixes:
    - src/io/live2d/
    - packages/adapters/live2d/

tools:
  eslint:
    enabled: true
  typecheck:
    # Typechecking uses the independent .repoatlas/tsconfig.json below.
    enabled: true
    # project defaults to paths.tsconfig; set it only for a separate project.
  knip:
    enabled: true
    config: .repoatlas/knip.json
    # Kukla2D has a root package.json, so Knip runs from the repository root.
    directory: null
    # project defaults to paths.tsconfig.
  output:
    format: text

# Every registered rule is enabled by default. Controls may disable one rule
# globally or except matching repository-relative paths for that rule only.
rules:
  # Preserve Kukla2D's existing Knip policy: export analysis is intentionally
  # disabled while other project-level checks remain active.
  DEAD-002: false
  QUALITY-001:
    severity: warning
    options:
      maxLines: 999
# Example:
# rules:
#   ARCH-RS-1:
#     enabled: true
#     exceptions:
#       - src/legacy-browser-bridge/**
